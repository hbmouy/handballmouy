<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="images/logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning - HBM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script>if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --jersey-yellow: #e2f438; --jersey-green: #2cd646; --jersey-purple: #9d4edd;
    --font-display: 'Anton', sans-serif; --font-body: 'DM Sans', sans-serif;
    --bg-body: #f5f8f5; --bg-card: #ffffff; --text-main: #0b130a;
    --border-color: #0b130a; --shadow-color: #0b130a; --nav-bg: rgba(255,255,255,0.85);
}
[data-theme="dark"] {
    --bg-body: #0b130a; --bg-card: #142113; --text-main: #f5f8f5;
    --border-color: #f5f8f5; --shadow-color: var(--jersey-green);
    --nav-bg: rgba(11,19,10,0.85);
}
body { background: var(--bg-body); color: var(--text-main); font-family: var(--font-body); line-height: 1.8; overflow-x: hidden; position: relative; transition: background 0.3s, color 0.3s; }
body::before, body::after { content: ""; position: absolute; width: 100%; height: 1200px; z-index: -1; opacity: 0.85; pointer-events: none; }
body::before { top: 0; left: 0; background: linear-gradient(135deg, var(--jersey-yellow) 30%, var(--jersey-green) 100%); clip-path: polygon(0 0, 100% 0, 100% 350px, 70% 220px, 30% 480px, 0 280px); }
body::after { top: 700px; right: 0; width: 80%; background: linear-gradient(225deg, rgba(226,244,56,0.6) 0%, rgba(44,214,70,0.6) 100%); clip-path: polygon(100% 200px, 100% 800px, 20% 900px, 0% 600px, 40% 400px); }

nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; height: 95px; padding: 0 2rem; background: var(--nav-bg); backdrop-filter: blur(15px); border-bottom: 4px solid var(--border-color); }
.nav-container { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1200px; height: 100%; position: relative; }
.nav-logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: flex; align-items: center; justify-content: center; text-decoration: none; z-index: 1002; transition: 0.3s cubic-bezier(0.175,0.885,0.32,1.275); }
.nav-logo img { height: 85px; filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.2)); }
.nav-logo:hover { transform: translate(-50%,-50%) scale(1.08); }
.nav-group { display: flex; gap: 1.4rem; list-style: none; align-items: center; width: 46%; }
.nav-group.left { justify-content: flex-end; } .nav-group.right { justify-content: flex-start; }
.nav-group a, .dropdown-trigger { color: var(--text-main); text-decoration: none; font-family: var(--font-display); font-size: 1.05rem; font-style: italic; text-transform: uppercase; letter-spacing: 0.03em; transition: 0.2s; cursor: pointer; white-space: nowrap; }
.nav-group a:hover, .dropdown-trigger:hover { color: var(--jersey-purple); }
.nav-group a.active { color: var(--jersey-purple); }
.theme-toggle-btn { background: transparent; border: 2px solid var(--border-color); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; box-shadow: 3px 3px 0px var(--border-color); transition: transform 0.2s, box-shadow 0.2s; }
.theme-toggle-btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0px var(--jersey-purple); }
.theme-toggle-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--text-main); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.sun-icon { display: none; } .moon-icon { display: block; }
[data-theme="dark"] .sun-icon { display: block; } [data-theme="dark"] .moon-icon { display: none; }
.burger { display: none; flex-direction: column; justify-content: space-between; width: 30px; height: 21px; background: transparent; border: none; cursor: pointer; z-index: 1100; }
.burger span { width: 100%; height: 3px; background-color: var(--border-color); transition: all 0.3s ease; }
.burger.toggle span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
.burger.toggle span:nth-child(2) { opacity: 0; }
.burger.toggle span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }
.dropdown { position: relative; }
.dropdown-content { display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); background: var(--bg-card); min-width: 180px; border: 3px solid var(--border-color); padding: 0.5rem 0; list-style: none; box-shadow: 6px 6px 0px var(--shadow-color); }
.dropdown-content li a { padding: 0.6rem 1.2rem; font-family: var(--font-body); font-size: 0.9rem; font-style: normal; display: block; text-transform: none; text-align: center; color: var(--text-main); }
.dropdown-content li a:hover { background: var(--bg-body); color: var(--jersey-purple); }
.dropdown:hover .dropdown-content { display: block; }
.dropdown.active .dropdown-content { display: block; position: static; transform: none; box-shadow: none; border: none; border-left: 2px solid var(--jersey-purple); margin-left: 10px; padding-left: 5px; }
@media (max-width: 950px) {
    nav { height: 70px; }
    .nav-logo { position: static; transform: none; } .nav-logo:hover { transform: scale(1.05); } .nav-logo img { height: 55px; }
    .burger { display: flex; }
    .nav-group.right { display: none; }
    .nav-group.left { position: fixed; right: -100%; top: 0; height: 100vh; width: 280px; background: var(--bg-card); border-left: 4px solid var(--border-color); flex-direction: column; align-items: flex-start; justify-content: flex-start; padding: 100px 2rem 2rem; gap: 1.5rem; transition: right 0.4s ease; overflow-y: auto; z-index: 1000; }
    .nav-group.left.active { right: 0; }
    .nav-group.left a { font-size: 1.3rem; width: 100%; display: block; }
    .dropdown { width: 100%; }
    .dropdown-content { position: static; transform: none; background: var(--bg-body); border: none; border-left: 3px solid var(--jersey-purple); box-shadow: none; padding: 0 0 0 1rem; margin-top: 0.5rem; }
    .dropdown-content li a { text-align: left; }
    body::before { clip-path: polygon(0 0, 100% 0, 100% 200px, 0 120px); }
}

.content-wrapper { max-width: 900px; margin: 160px auto 100px; padding: 0 20px; position: relative; z-index: 2; }
.label-container { text-align: center; }
.section-label { color: var(--text-main); background: var(--bg-card); border: 2px solid var(--border-color); box-shadow: 3px 3px 0px var(--shadow-color); text-transform: uppercase; font-family: var(--font-display); font-style: italic; font-size: 1.2rem; letter-spacing: 2px; display: inline-block; margin: 0 auto 1rem; padding: 0.2rem 1rem; transform: rotate(-1deg); }
h1 { font-family: var(--font-display); font-size: clamp(2.8rem,7.5vw,4.8rem); text-align: center; margin-bottom: 3rem; line-height: 1; font-style: italic; letter-spacing: -1px; color: var(--text-main); text-shadow: 4px 4px 0px var(--bg-card), 8px 8px 0px var(--border-color); }

.training-card { background: var(--bg-card); border: 3px solid var(--border-color); border-left: 10px solid var(--jersey-green); box-shadow: 8px 8px 0 var(--border-color); padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 40px; }
.training-card-left { display: flex; align-items: center; gap: 16px; }
.training-icon { font-size: 2rem; }
.training-title { font-family: var(--font-display); font-size: 1.5rem; font-style: italic; color: var(--text-main); margin-bottom: 4px; }
.training-subtitle { font-size: 0.85rem; font-weight: 500; opacity: 0.7; }
.training-badge { background: var(--jersey-green); color: #0b130a; font-family: var(--font-display); font-style: italic; font-size: 1rem; padding: 8px 20px; border: 2px solid var(--border-color); box-shadow: 4px 4px 0 var(--border-color); white-space: nowrap; }
footer { text-align: center; padding: 60px; color: var(--text-main); font-weight: 700; border-top: 3px dashed var(--border-color); background: var(--bg-card); position: relative; z-index: 2; }

@media (max-width: 700px) {
    .training-card { flex-direction: column; text-align: center; }
    .training-card-left { flex-direction: column; }
    .content-wrapper { margin-top: 110px; }
}
</style>
<script src="nav-component.js"></script>
</head>
<body>

<div id="hbm-nav"></div>

<main class="content-wrapper">
    <div class="label-container">
        <span class="section-label">Planning du HBM</span>
    </div>
    <h1>PLANNING</h1>

    <div class="training-card">
        <div class="training-card-left">
            <div class="training-icon">🏐</div>
            <div>
                <div class="training-title">ENTRAÎNEMENTS</div>
                <div class="training-subtitle">📍 Complexe Sportif, 6-8 Av. du 8 Mai 1945, 60250 Mouy</div>
            </div>
        </div>
        <div class="training-badge">TOUS LES JEUDIS — 20H À 22H</div>
    </div>
</main>

<footer>© 2026 HBM — Handball Club Mouy<br><a href="politique-confidentialite.html" style="color:inherit; opacity:0.7; font-size:0.85rem; font-weight:400; text-decoration:underline;">Politique de confidentialité</a></footer>

</body>
</html>
